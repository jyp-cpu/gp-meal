  <style>

    /* 2. 상시 미세 발광(글로우) 애니메이션 */
    @keyframes ac-glow {

      }
    }

    .hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 14px;
      transition: all 0.2s ease;
      z-index: 10;
      animation: ac-glow 2.4s infinite ease-in-out;
    }

    .hotspot:hover {
      animation: none;
      box-shadow: 0 0 24px 6px rgba(255, 214, 0, 1) !important;
      border: 2px solid #ffffff !important;
      transform: scale(1.03);

    .hotspot-box { left: 20%; top: 70%; width: 22%; height: 28%; }
    .hotspot-tray { left: 43.5%; top: 63.8%; width: 8.8%; height: 8.5%; display: flex; align-items: center; justify-content: center; }

    .hotspot::after {

    .modal-overlay {

  </style>
</head>

  <!-- 4. 달력 모달 -->
  <div id="calendarModal" class="modal-overlay">
    <div class="ac-dialog" style="max-width: 620px;">
      <button class="modal-close-btn" onclick="closeModal('calendarModal')">×</button>
      <h2>🗓️ 추억 달력 & 걸포초 식단표</h2>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <button onclick="changeCalMonth(-1)" class="ac-btn" style="width:auto; padding:6px 16px;">◀ 이전달</button>
        <span id="calMonthTitle" style="font-size:1.25rem; font-weight:bold; color:var(--ac-wood-dark);">2026년 06월</span>
        <button onclick="changeCalMonth(1)" class="ac-btn" style="width:auto; padding:6px 16px;">다음달 ▶</button>
      </div>
      <div class="calendar-grid" id="calGrid"></div>
      <h3 style="margin-top:20px; margin-bottom:6px; color:var(--ac-wood-dark);">📋 걸포초등학교 급식 식단표</h3>
      <div class="recipe-board" id="dailyMenuList">날짜를 클릭하면 그날의 식단표가 펼쳐집니다! 🍃</div>
    </div>

  <script>
    const NEIS_KEY = "48b1ca2e2a1c41e6b4a891ab5556f0a6";
    const ATPT_CODE = "J10";
    const SCHOOL_NAME = "걸포초등학교";
    let cachedSchoolCode = "7531107";

    let memoryData = {};
    let selectedDate = new Date().toISOString().split("T")[0];
    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth() + 1;

    // Firestore 실시간 리스너 연동
    window.addEventListener("DOMContentLoaded", () => {
      initSchoolCode();
      db.collection("lunchMemories").onSnapshot((snapshot) => {
        snapshot.forEach((doc) => {
          memoryData[doc.id] = doc.data();
        });

        const dates = Object.keys(memoryData).sort();
        if (dates.length > 0 && !memoryData[selectedDate]) {
          selectedDate = dates[dates.length - 1];
          const [y, m] = selectedDate.split("-");
          calYear = parseInt(y);
          calMonth = parseInt(m);
        }
        syncView(selectedDate);
      });
    });

    async function initSchoolCode() {
      try {
        const url = `https://open.neis.go.kr/hub/schoolInfo?KEY=${NEIS_KEY}&Type=json&pIndex=1&pSize=5&ATPT_OFCDC_SC_CODE=${ATPT_CODE}&SCHUL_NM=${encodeURIComponent(SCHOOL_NAME)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data?.schoolInfo?.[1]?.row?.[0]?.SD_SCHUL_CODE) {
          cachedSchoolCode = data.schoolInfo[1].row[0].SD_SCHUL_CODE;
        }
      } catch (e) {
        console.log("기본 표준코드 유지:", cachedSchoolCode);
      }
    }

    async function fetchNeisMeal(dateStr, targetSelectId = null) {
      const cleanDate = dateStr.replace(/-/g, "");
      const targetSelect = targetSelectId ? document.getElementById(targetSelectId) : null;
      if (targetSelect) targetSelect.innerHTML = "<option>식단표 조회 중...</option>";

      try {
        const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${NEIS_KEY}&Type=json&pIndex=1&pSize=10&ATPT_OFCDC_SC_CODE=${ATPT_CODE}&SD_SCHUL_CODE=${cachedSchoolCode}&MLSV_YMD=${cleanDate}`;
        const res = await fetch(url);
        const data = await res.json();
        let menuItems = [];
        if (data?.mealServiceDietInfo?.[1]?.row?.[0]?.DDISH_NM) {
          menuItems = data.mealServiceDietInfo[1].row[0].DDISH_NM
            .replace(/[0-9\.\*\(\)]/g, "")
            .split("<br/>")
            .map(m => m.trim())
            .filter(m => m.length > 0);
        } else {
          menuItems = ["수제 치즈 닭갈비", "차돌된장찌개", "스파게티", "치킨텐더 샐러드", "신선 과일"];
        }
        if (targetSelect) targetSelect.innerHTML = menuItems.map(m => `<option value="${m}">${m}</option>`).join("");
        return menuItems;
      } catch (err) {
        const fallback = ["맛있는 쌀밥", "달콤 소불고기", "영양 잡채", "미역국", "배추김치"];
        if (targetSelect) targetSelect.innerHTML = fallback.map(m => `<option value="${m}">${m}</option>`).join("");
        return fallback;
      }
    }

    function handleBoxClick() {
      document.getElementById("pwSection").style.display = "block";
      document.getElementById("uploadFormSection").style.display = "none";
      document.getElementById("adminPwInput").value = "";
      openModal("uploadModal");
    }

    function verifyPassword() {
      if (document.getElementById("adminPwInput").value.trim() === "0628") {
        document.getElementById("pwSection").style.display = "none";
        document.getElementById("uploadFormSection").style.display = "block";
        document.getElementById("recordDate").value = selectedDate;
        fetchNeisMeal(selectedDate, "uploadSelect");
      } else {
        alert("비밀번호가 올바르지 않습니다! (힌트: 0628)");
      }
    }

    function compressImage(file, maxWidth = 800) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const scale = maxWidth / img.width;
            canvas.width = (img.width > maxWidth) ? maxWidth : img.width;
            canvas.height = (img.width > maxWidth) ? (img.height * scale) : img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.75));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function saveRecord() {
      const date = document.getElementById("recordDate").value;
      const bestMenu = document.getElementById("uploadSelect").value;
      const comment = document.getElementById("commentInput").value.trim() || "선생님 덕분에 오늘도 든든하게 먹었습니다! ❤️";
      const photoFile = document.getElementById("mealPhotoFile").files[0];
      const submitBtn = document.getElementById("saveSubmitBtn");

      if (!date || !bestMenu) {
        alert("날짜와 최고의 메뉴를 선택해주세요!");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "클라우드 전송 중...";

      let photoData = memoryData[date]?.photo || "";
      if (photoFile) {
        photoData = await compressImage(photoFile);
      }

      try {
        await db.collection("lunchMemories").doc(date).set({
          date: date,
          bestMenu: bestMenu,
          comment: comment,
          photo: photoData,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("파이어베이스 클라우드에 성공적으로 등록되었습니다! 🍃");
        closeModal("uploadModal");
        syncView(date);
      } catch (error) {
        alert("등록 중 오류가 발생했습니다: " + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "클라우드에 추억 등록 완료 ✨";
      }
    }

    function handleTrayClick() {
      const current = memoryData[selectedDate];
      const img = document.getElementById("trayFullImg");
      document.getElementById("trayModalTitle").innerText = `🍱 [${selectedDate}] 식판 사진`;
      if (current && current.photo) {
        img.src = current.photo;
        document.getElementById("trayModalDesc").innerText = `최고의 메뉴: ${current.bestMenu}`;
      } else {
        img.src = "bg.png";
        document.getElementById("trayModalDesc").innerText = "등록된 식판 사진이 없습니다. 박스를 눌러 사진을 올려보세요!";
      }
      openModal("trayViewerModal");
    }

    /* 3. 선물상자 한줄평 전광판 - 수식어 없이 순수 한줄평만 표시 */
    function handleGiftClick() {
      const current = memoryData[selectedDate] || {
        bestMenu: "사랑이 담긴 특식",
        comment: "선생님 덕분에 언제나 행복한 학교생활이었습니다! ❤️"
      };
      document.getElementById("giftBestMenuTitle").innerText = current.bestMenu;
      document.getElementById("giftTickerComment").innerText = current.comment;
      openModal("giftModal");

      confetti({ particleCount: 110, spread: 80, origin: { y: 0.6 } });
    }

    function openCalendarModal() {
      renderCalendar();
      updateRecipeBoard(selectedDate);
      openModal("calendarModal");
    }

    function changeCalMonth(delta) {
      calMonth += delta;
      if (calMonth < 1) { calMonth = 12; calYear--; }
      else if (calMonth > 12) { calMonth = 1; calYear++; }
      renderCalendar();
    }

    function renderCalendar() {
      document.getElementById("calMonthTitle").innerText = `${calYear}년 ${String(calMonth).padStart(2, "0")}월`;
      const grid = document.getElementById("calGrid");
      grid.innerHTML = "";

      ["일", "월", "화", "수", "목", "금", "토"].forEach(name => {
        const h = document.createElement("div");
        h.className = "cal-day-header";
        h.innerText = name;
        grid.appendChild(h);
      });

      const firstDay = new Date(calYear, calMonth - 1, 1).getDay();
      const totalDays = new Date(calYear, calMonth, 0).getDate();

      for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement("div"));

      for (let d = 1; d <= totalDays; d++) {
        const cell = document.createElement("div");
        cell.className = "cal-day-cell";
        cell.innerText = d;
        const dateStr = `${calYear}-${String(calMonth).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

        if (memoryData[dateStr]) {
          cell.classList.add("active-data");
          const dot = document.createElement("span");
          dot.innerText = "🍃";
          dot.style.fontSize = "0.75rem";
          cell.appendChild(dot);
        }

        if (dateStr === selectedDate) cell.classList.add("selected");

        cell.onclick = () => {
          syncView(dateStr);
          updateRecipeBoard(dateStr);
          renderCalendar();
        };
        grid.appendChild(cell);
      }
    }

    async function updateRecipeBoard(dateStr) {
      const board = document.getElementById("dailyMenuList");
      board.innerHTML = "걸포초 식단표 조회 중... 🍃";
      const dishes = await fetchNeisMeal(dateStr);
      board.innerHTML = `
        <div style="font-weight:bold; margin-bottom:8px; color:#5c3a21;">🍱 [${dateStr}] 걸포초 오늘의 식단:</div>
        <div>${dishes.map(d => `<span class="menu-item-tag">🌿 ${d}</span>`).join("")}</div>
      `;
    }

    function syncView(dateStr) {
      selectedDate = dateStr;
      document.getElementById("currentViewDateText").innerText = dateStr;
      const record = memoryData[dateStr];
      const trayPreview = document.getElementById("trayPreviewImg");
      if (record && record.photo) {
        trayPreview.src = record.photo;
        trayPreview.style.display = "block";
      } else {
        trayPreview.style.display = "none";
      }
    }

    function openModal(id) { document.getElementById(id).style.display = "flex"; }
    function closeModal(id) { document.getElementById(id).style.display = "none"; }

    /* 1. 업로드 모달(uploadModal)은 배경 클릭 닫기 방지 (다른 단순 조회 모달만 배경 클릭 허용) */
    window.onclick = (e) => {
      if (e.target.classList.contains("modal-overlay")) {
        if (e.target.id !== "uploadModal") {
          e.target.style.display = "none";
        }
      }
    };
  </script>
</body>
</html>
